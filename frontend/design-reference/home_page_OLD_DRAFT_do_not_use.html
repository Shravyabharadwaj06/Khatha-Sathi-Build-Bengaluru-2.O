<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0F0F56">
  <meta name="description" content="CHOTU.ai home for your neighborhood shop tools."><title>CHOTU.ai | Your shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/"><link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin=""><link href="./Home page_files/css2" rel="stylesheet">
  <style>
    :root{--indigo:#0F0F56;--blue:#C2DCE3;--yellow:#EDEA43;--paper:#f8f7f1;--white:#fff;--muted:#686981;--line:#e9e7de}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--indigo);font-family:'DM Sans',Arial,sans-serif;min-height:100vh}.shell{width:min(1120px,calc(100% - 48px));margin:auto}.topbar{height:88px;display:flex;align-items:center;justify-content:space-between}.top-action{min-width:142px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 17px;border:1px solid #d9d8e5;background:var(--white);color:var(--indigo);font:700 14px 'DM Sans',Arial,sans-serif;cursor:pointer;transition:background .18s,transform .18s}.top-action:hover{background:var(--blue);transform:translateY(-1px)}.top-action:focus-visible,.feature:focus-visible{outline:3px solid #7777bb;outline-offset:3px}.top-action svg{width:19px;height:19px;flex:none}.wordmark{position:absolute;left:50%;transform:translateX(-50%);font-weight:800;letter-spacing:-1.5px;font-size:24px}.wordmark span{opacity:.55}.heading{padding:26px 0 25px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:#77779a;margin:0 0 9px}.heading h1{font-size:clamp(30px,4vw,42px);letter-spacing:-1.7px;line-height:1.12;margin:0}.heading p{color:var(--muted);font-size:15px;margin:10px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:7px 0 50px}.feature{appearance:none;text-align:left;border:1px solid var(--line);padding:0;background:var(--white);color:var(--indigo);cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .2s,border-color .2s,box-shadow .2s}.feature:hover{transform:translateY(-4px);border-color:#aaa9c8;box-shadow:0 12px 24px #0f0f5610}.art{display:block;background:var(--blue);height:clamp(160px,21vw,235px);overflow:hidden}.feature:nth-child(2) .art,.feature:nth-child(5) .art{background:#e4edf0}.feature:nth-child(3) .art,.feature:nth-child(6) .art{background:#f4eddf}.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 48%;mix-blend-mode:multiply}.label{min-height:69px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 19px;font-size:16px;font-weight:700;letter-spacing:-.2px}.arrow{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--yellow);font-size:19px;line-height:1}.footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--indigo);color:white;padding:13px 19px;font-size:14px;font-weight:600;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:1000px){.heading{padding-top:38px}.grid{gap:23px}.art{height:230px}}
    @media(max-width:700px){.shell{width:calc(100% - 32px)}.topbar{height:76px}.top-action{min-width:0;min-height:46px;padding:0 13px;font-size:13px}.top-action svg{width:18px}.wordmark{font-size:21px}.heading{padding:22px 0 20px}.heading h1{font-size:33px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:38px}.art{height:clamp(132px,31vw,200px)}.label{min-height:61px;padding:13px;font-size:14px}.arrow{width:27px;height:27px}}
    @media(max-width:390px){.shell{width:calc(100% - 24px)}.topbar{height:70px}.top-action{padding:0 9px;gap:7px;font-size:12px}.wordmark{font-size:19px}.grid{gap:10px}.art{height:132px}.label{font-size:13px;padding:11px 10px}.arrow{width:24px;height:24px}.footer{font-size:11px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="shell topbar">
    <button class="top-action" type="button" data-action="My Profile" aria-label="My Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.8 20c.8-3.4 3.2-5.2 7.2-5.2s6.4 1.8 7.2 5.2"></path></svg><span>My Profile</span>
    </button>
    <a class="wordmark" href="file:///C:/Users/shrav/Documents/Codex/2026-11-18/i-x20/outputs/app-home.html" aria-label="CHOTU.ai home">CHOTU<span>.ai</span></a>
    <button class="top-action" type="button" data-action="Notifications" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg><span>Notifications</span>
    </button>
  </header>
  <main class="shell">
    <section class="heading"><p class="eyebrow">Your shop, at a glance</p><h1>What would you like to do?</h1><p>Choose a tool to get started.</p></section>
    <section class="grid" aria-label="Shop tools">
      <button class="feature" type="button" data-action="Quick View"><span class="art"><img src="./Home page_files/illustration-1.png" alt="Shop owner using a phone in his store" loading="eager"></span><span class="label"><span>Report an issue</span><span class="arrow" aria-hidden="true">↗</span></span></button>
      <button class="feature" type="button" data-action="Update products"><span class="art"><img src="./Home page_files/illustration-2.png" alt="Shop owner updating products on a phone" loading="lazy"></span><span class="label"><span>Update products</span><span class="arrow" aria-hidden="true">↗</span></span></button>
      <button class="feature" type="button" data-action="Customer update"><span class="art"><img src="./Home page_files/illustration-3.png" alt="Shop owner speaking with a customer" loading="lazy"></span><span class="label"><span>Customer update</span><span class="arrow" aria-hidden="true">↗</span></span></button>
      <button class="feature" type="button" data-action="AI assistant"><span class="art"><img src="./Home page_files/illustration-4.png" alt="Shop owner and young customer in a store" loading="lazy"></span><span class="label"><span>AI assistant</span><span class="arrow" aria-hidden="true">↗</span></span></button>
      <button class="feature" type="button" data-action="Analytics dashboard"><span class="art"><img src="./Home page_files/illustration-5.png" alt="Shop owner checking information on a tablet" loading="lazy"></span><span class="label"><span>Analytics dashboard</span><span class="arrow" aria-hidden="true">↗</span></span></button>
      <button class="feature" type="button" data-action="Report an issue"><span class="art"><img src="./Home page_files/illustration-6.png" alt="Small business owner using a phone at the counter" loading="lazy"></span><span class="label"><span>Report an issue</span><span class="arrow" aria-hidden="true">↗</span></span></button>
    </section>
    <footer class="footer"><span>CHOTU.ai</span><span>A little help for your shop</span></footer>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
  <script>const toast=document.querySelector('.toast');let timer;document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{toast.textContent=button.dataset.action;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}));</script>


</body></html>
