# Runs on every push and pull request. Uses NO secrets: the frontend is tested in mock mode
# and the backend tests use mock ASR/TTS and an in-memory store (no Supabase, no Gnani credits).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_USE_MOCK_API: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:assistant

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ASR_PROVIDER: mock
      TTS_PROVIDER: mock
      INTENT_MODE: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
